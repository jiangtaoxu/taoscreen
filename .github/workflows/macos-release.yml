name: 发布 macOS DMG

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 已推送到 GitHub 的 vX.Y.Z 标签
        required: true
        type: string

permissions: {}

concurrency:
  group: macos-release-refs/tags/${{ inputs.tag || github.ref_name }}

env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: 构建通用 DMG
    if: ${{ !github.event.deleted }}
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 按 tag 构建 DMG
        run: python3 macos/scripts/package-release.py --github-dmg "$TAG_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: taoscreen-dmg-${{ github.run_attempt }}
          path: macos/dist/TaoScreen-*-universal.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    name: 上传到 GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: 发布安装包
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG_NAME#v}"
          dmg="release/TaoScreen-${version}-universal.dmg"
          test -f "$dmg"

          release_tags="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')"
          if grep -Fxq -- "$TAG_NAME" <<< "$release_tags"; then
            gh release upload "$TAG_NAME" "$dmg"
          else
            gh release create "$TAG_NAME" "$dmg" --verify-tag --generate-notes
          fi
