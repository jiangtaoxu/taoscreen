<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>TaoScreen · 用户管理</title>
  <style nonce="{{nonce}}">
    :root {
      color-scheme: light;
      --paper: #f7f8f5;
      --surface: #fff;
      --ink: #1d302a;
      --muted: #5b6b62;
      --line: #dce3dc;
      --green: #245a43;
      --green-hover: #183e2e;
      --soft: #edf3ee;
      --error: #9b302e;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    body { margin: 0; -webkit-font-smoothing: antialiased; }
    [hidden] { display: none !important; }
    input, button { font: inherit; }
    button {
      min-height: 40px;
      padding: 8px 14px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 3px solid #609b77;
      outline-offset: 2px;
    }
    .primary { background: var(--green); color: white; }
    .primary:hover:not(:disabled) { background: var(--green-hover); }
    .secondary { background: var(--surface); border-color: var(--line); color: var(--ink); }
    .secondary:hover:not(:disabled) { background: var(--soft); border-color: #aebfb2; }
    .wrap { max-width: 1280px; margin: 0 auto; padding-inline: 36px; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
    .topbar-inner {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-block: 12px;
    }
    .brand, .account { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand strong { font-size: 19px; letter-spacing: -.45px; }
    .brand-area { color: var(--muted); border-left: 1px solid var(--line); padding-left: 12px; }
    .mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: none;
      border-radius: 10px;
      background: var(--green);
    }
    .mark svg { width: 22px; height: 22px; }
    #admin { color: var(--muted); overflow-wrap: anywhere; }
    .account form { flex: none; margin: 0; }
    .account button { padding-inline: 12px; }
    main { padding-block: 36px 60px; }
    .page-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 30px; line-height: 1.25; letter-spacing: -.5px; }
    .panel {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 2px 5px #1d302a08;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
    }
    .search { display: flex; flex: 1 1 400px; gap: 8px; }
    input {
      min-width: 0;
      width: 100%;
      min-height: 40px;
      border: 1px solid #cbd6ce;
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--surface);
      color: var(--ink);
    }
    input::placeholder { color: var(--muted); }
    .search input { max-width: 380px; }
    .search button, #refresh { white-space: nowrap; }
    .list-status {
      margin: 0;
      padding: 0 20px 12px;
      color: var(--muted);
    }
    .list-status.error, .dialog-body .error { color: var(--error); }
    .list-status.error { padding-top: 2px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 13px 16px; }
    th:first-child, td:first-child { padding-left: 20px; }
    th:last-child, td:last-child { padding-right: 20px; }
    th {
      border-block: 1px solid var(--line);
      background: var(--paper);
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }
    td { border-bottom: 1px solid #e9ede8; }
    tbody tr:last-child td { border-bottom: 0; }
    .user-row:hover { background: #f8faf7; }
    .user-name, .user-email { display: block; overflow-wrap: anywhere; }
    .user-email { margin-top: 3px; font-size: 12px; color: var(--muted); }
    .source {
      display: inline-flex;
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--soft);
      color: var(--green);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .numeric { font-variant-numeric: tabular-nums; }
    .cell-value { display: inline-block; }
    .cell-label { display: none; }
    .row-action { text-align: right; }
    .row-action button {
      min-height: 34px;
      padding: 5px 10px;
      border-color: var(--line);
      background: var(--surface);
      color: var(--green);
      white-space: nowrap;
    }
    .row-action button:hover { background: var(--soft); border-color: #aebfb2; }
    .blank td {
      padding: 44px 20px;
      text-align: center;
      color: var(--muted);
    }
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
    }
    .pager-actions { display: flex; gap: 8px; }
    .pager button { min-height: 36px; padding-block: 6px; }
    dialog {
      width: min(620px, calc(100% - 32px));
      max-height: calc(100% - 32px);
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 18px 55px #17291f30;
    }
    dialog::backdrop { background: #1d302a75; }
    #create-dialog { width: min(450px, calc(100% - 32px)); }
    .dialog-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
    }
    .dialog-heading h2 { margin: 0; font-size: 19px; }
    .dialog-body { padding: 20px 22px; }
    .dialog-body > :first-child { margin-top: 0; }
    .dialog-body > :last-child { margin-bottom: 0; }
    .detail-name { margin: 0; font-size: 22px; overflow-wrap: anywhere; }
    .detail-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px 18px;
      margin: 12px 0 0;
    }
    .detail-field { padding: 8px 0; overflow-wrap: anywhere; }
    .detail-field dt { color: var(--muted); font-size: 12px; }
    .detail-field dd { margin: 4px 0 0; font-weight: 600; }
    .wide { grid-column: 1 / -1; }
    .identities { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    .identities h3 { margin: 0 0 10px; font-size: 15px; }
    .identity { padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
    .identity + .identity { margin-top: 8px; }
    .identity .detail-fields { margin-top: 4px; }
    .muted { color: var(--muted); }
    .create-form, .create-form label { display: grid; gap: 8px; }
    .create-form { gap: 14px; }
    .create-form label { font-weight: 600; }
    .create-form small { color: var(--muted); font-weight: 400; }
    .create-form .primary { justify-self: end; }
    .feedback { margin: 12px 0 0; }
    .feedback:empty { display: none; }
    .feedback.success { color: var(--green); }
    @media (max-width: 960px) {
      .wrap { padding-inline: 24px; }
      th, td { padding-inline: 10px; }
    }
    @media (max-width: 740px) {
      .wrap { padding-inline: 16px; }
      .topbar-inner { align-items: flex-start; flex-direction: column; gap: 8px; }
      .account { justify-content: space-between; width: 100%; }
      main { padding-block: 26px 40px; }
      h1 { font-size: 25px; }
      .toolbar, .pager { padding-inline: 14px; }
      .list-status { padding-inline: 14px; }
      .search input { max-width: none; }
      input { font-size: 16px; }
      table, tbody { display: block; }
      thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      .user-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding: 14px;
        border-top: 1px solid var(--line);
      }
      .user-row td { padding: 0; border: 0; }
      .user-row .user-cell { grid-column: 1 / -1; }
      .user-row .row-action { grid-column: 2; align-self: end; }
      .cell-label { display: block; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
      .blank, .blank td { display: block; }
      .blank { border-top: 1px solid var(--line); }
      .dialog-heading, .dialog-body { padding-inline: 16px; }
    }
    @media (max-width: 370px) {
      .pager { align-items: flex-start; flex-direction: column; }
      .detail-fields { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M8 10h8m-3-3 3 3-3 3"/></svg></span>
        <strong>TaoScreen</strong>
        <span class="brand-area">管理后台</span>
      </div>
      <div class="account">
        <span id="admin"></span>
        <form id="logout" action="/admin/logout" method="post" hidden>
          <button class="secondary" type="submit">退出后台</button>
        </form>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="page-heading">
      <h1>用户管理</h1>
      <button id="open-create" class="primary" type="button" hidden>创建本地账号</button>
    </div>

    <section class="panel" aria-label="用户列表">
      <div class="toolbar">
        <form id="search-form" class="search" role="search">
          <input id="query" type="search" aria-label="搜索用户" placeholder="搜索邮箱、昵称或用户 ID" disabled>
          <button id="search" class="secondary" type="submit" disabled>搜索</button>
        </form>
        <button id="refresh" class="secondary" type="button" disabled>刷新</button>
      </div>
      <p id="list-status" class="list-status" role="status" tabindex="-1">正在加载用户…</p>
      <div id="table-wrap" class="table-wrap" hidden>
        <table role="table" aria-label="用户">
          <thead role="rowgroup">
            <tr role="row">
              <th role="columnheader" scope="col">用户</th>
              <th role="columnheader" scope="col">注册来源</th>
              <th role="columnheader" scope="col">注册时间</th>
              <th role="columnheader" scope="col">最近登录</th>
              <th role="columnheader" scope="col">设备 / 有效会话</th>
              <th class="row-action" role="columnheader" scope="col">操作</th>
            </tr>
          </thead>
          <tbody id="users" role="rowgroup"></tbody>
        </table>
      </div>
      <div id="pager" class="pager" hidden>
        <span id="page" class="numeric"></span>
        <div class="pager-actions">
          <button id="previous" class="secondary" type="button">上一页</button>
          <button id="next" class="secondary" type="button">下一页</button>
        </div>
      </div>
      <noscript><p class="list-status">请启用 JavaScript 后刷新页面。</p></noscript>
    </section>
  </main>

  <dialog id="details" aria-labelledby="details-title">
    <div class="dialog-heading">
      <h2 id="details-title">账号详情</h2>
      <form method="dialog"><button class="secondary">关闭</button></form>
    </div>
    <div class="dialog-body">
      <p id="detail-status" class="muted" role="status"></p>
      <div id="detail-content"></div>
    </div>
  </dialog>

  <dialog id="create-dialog" aria-labelledby="create-title">
    <div class="dialog-heading">
      <h2 id="create-title">创建本地账号</h2>
      <form method="dialog"><button id="close-create" class="secondary">关闭</button></form>
    </div>
    <div class="dialog-body">
      <form id="create-user" class="create-form" action="/v1/admin/users" method="post">
        <label>邮箱
          <input name="email" type="email" autocomplete="off" maxlength="254" required autofocus>
        </label>
        <label>初始密码
          <input name="password" type="password" autocomplete="new-password" minlength="12" required aria-describedby="password-hint">
          <small id="password-hint">至少 12 个字符。</small>
        </label>
        <button id="submit-create" class="primary" type="submit">创建账号</button>
      </form>
      <p id="create-status" class="feedback" role="status"></p>
    </div>
  </dialog>

  <script nonce="{{nonce}}">
    'use strict';

    const $ = id => document.getElementById(id);
    const limit = 50;
    const dateFormat = new Intl.DateTimeFormat('zh-CN', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    });
    const numberFormat = new Intl.NumberFormat('zh-CN');
    const providers = new Map([['google', 'Google'], ['github', 'GitHub'], ['password', '本地账号']]);
    let query = '';
    let offset = 0;
    let total = 0;
    let listRequest;
    let detailRequest;

    const source = value => providers.get(value) || value;
    const date = value => dateFormat.format(new Date(value));
    const lastLogin = value => value ? date(value) : '从未登录';
    const count = value => numberFormat.format(value);

    function element(tag, text, className) {
      const node = document.createElement(tag);
      node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    async function api(path, options = {}) {
      let response;
      try {
        response = await fetch(path, {
          credentials: 'same-origin',
          ...options,
          headers: {Accept: 'application/json', ...options.headers}
        });
      } catch (error) {
        if (error.name === 'AbortError') throw error;
        throw new Error('无法连接管理服务，请检查网络后重试。');
      }
      if (!response.headers.get('content-type')?.includes('application/json')) {
        if (response.redirected || response.status === 401 || response.status === 403) {
          throw new Error('登录可能已过期，请刷新页面重新登录。');
        }
        throw new Error('服务暂时无法响应，请稍后重试。');
      }
      const body = await response.json();
      if (!response.ok) throw new Error(body.error?.message || '请求失败，请重试。');
      return body;
    }

    function cell(row, value, label, className) {
      const td = element('td', '', className);
      td.setAttribute('role', 'cell');
      if (label) {
        const heading = element('span', label, 'cell-label');
        heading.setAttribute('aria-hidden', 'true');
        td.append(heading);
      }
      td.append(value);
      row.append(td);
    }

    function userRow(user) {
      const row = element('tr', '', 'user-row');
      row.setAttribute('role', 'row');
      const identity = document.createElement('div');
      identity.append(element('strong', user.name || user.email, 'user-name'));
      if (user.name && user.name !== user.email) {
        identity.append(element('span', user.email, 'user-email'));
      }
      cell(row, identity, '', 'user-cell');
      cell(row, element('span', source(user.registration_provider), 'source'), '注册来源');
      cell(row, element('span', date(user.created_at), 'cell-value'), '注册时间', 'numeric');
      cell(row, element('span', lastLogin(user.last_login_at), 'cell-value'), '最近登录', 'numeric');
      cell(row, element('span', count(user.device_count) + ' / ' + count(user.active_sessions)), '设备 / 有效会话', 'numeric');
      const details = element('button', '详情');
      details.type = 'button';
      details.setAttribute('aria-label', '查看 ' + user.email + ' 的详情');
      details.addEventListener('click', () => showDetails(user.id));
      cell(row, details, '', 'row-action');
      return row;
    }

    function emptyRow(message) {
      const row = element('tr', '', 'blank');
      row.setAttribute('role', 'row');
      const td = element('td', message);
      td.colSpan = 6;
      td.setAttribute('role', 'cell');
      row.append(td);
      return row;
    }

    function updatePagination(loading) {
      $('previous').disabled = loading || offset === 0;
      $('next').disabled = loading || offset + limit >= total;
    }

    async function loadUsers(nextQuery = query, nextOffset = offset) {
      listRequest?.abort();
      const request = new AbortController();
      listRequest = request;
      const status = $('list-status');
      status.textContent = '正在加载用户…';
      status.classList.remove('error');
      $('table-wrap').setAttribute('aria-busy', 'true');
      updatePagination(true);
      try {
        const params = new URLSearchParams({q: nextQuery, offset: nextOffset, limit});
        const data = await api('/v1/admin/users?' + params, {signal: request.signal});
        if (request.signal.aborted) return;
        query = nextQuery;
        offset = data.offset;
        total = data.total;
        status.textContent = (query ? '匹配 ' : '共 ') + count(total) + ' 位用户';
        const rows = data.users.map(userRow);
        if (!rows.length) rows.push(emptyRow(query ? '未找到匹配的用户。' : '暂无用户。'));
        $('users').replaceChildren(...rows);
        $('table-wrap').hidden = false;
        $('pager').hidden = total <= limit;
        $('page').textContent = '第 ' + count(Math.floor(offset / limit) + 1) + ' / ' + count(Math.ceil(total / limit)) + ' 页';
        return true;
      } catch (error) {
        if (request.signal.aborted) return;
        status.textContent = error.message;
        status.classList.add('error');
      } finally {
        if (listRequest === request) {
          $('table-wrap').removeAttribute('aria-busy');
          updatePagination(false);
        }
      }
    }

    async function changePage(nextOffset) {
      if (await loadUsers(query, nextOffset)) $('list-status').focus();
    }

    function fieldList(fields) {
      const list = element('dl', '', 'detail-fields');
      for (const [label, value, wide] of fields) {
        const field = element('div', '', wide ? 'detail-field wide' : 'detail-field');
        field.append(element('dt', label), element('dd', value));
        list.append(field);
      }
      return list;
    }

    function renderDetails(data) {
      const user = data.user;
      const heading = element('h3', user.name || user.email, 'detail-name');
      const fields = fieldList([
        ['邮箱', user.email, true],
        ['邮箱验证', user.email_verified ? '已验证' : '未验证'],
        ['注册来源', source(user.registration_provider)],
        ['注册时间', date(user.created_at)],
        ['最近登录', lastLogin(user.last_login_at)],
        ['设备数', count(user.device_count)],
        ['有效会话数', count(user.active_sessions)],
        ['用户 ID', user.id, true]
      ]);
      const identities = element('section', '', 'identities');
      identities.append(element('h3', '绑定的登录方式'));
      if (!data.identities.length) {
        identities.append(element('p', '暂无第三方登录绑定。', 'muted'));
      }
      for (const identity of data.identities) {
        const card = element('div', '', 'identity');
        card.append(element('span', source(identity.provider), 'source'), fieldList([
          ['邮箱', identity.email, true],
          ['昵称', identity.name || '—', true],
          ['绑定时间', date(identity.created_at)],
          ['最近登录', lastLogin(identity.last_login_at)]
        ]));
        identities.append(card);
      }
      $('detail-content').replaceChildren(heading, fields, identities);
    }

    async function showDetails(id) {
      const dialog = $('details');
      const status = $('detail-status');
      const request = new AbortController();
      detailRequest = request;
      $('detail-content').replaceChildren();
      status.textContent = '正在加载账号详情…';
      status.classList.remove('error');
      status.hidden = false;
      dialog.showModal();
      try {
        const data = await api('/v1/admin/users/' + encodeURIComponent(id), {signal: request.signal});
        if (detailRequest !== request || !dialog.open) return;
        renderDetails(data);
        status.hidden = true;
      } catch (error) {
        if (request.signal.aborted) return;
        status.textContent = error.message;
        status.classList.add('error');
      }
    }

    $('details').addEventListener('close', () => detailRequest?.abort());
    $('search-form').addEventListener('submit', event => {
      event.preventDefault();
      loadUsers($('query').value.trim(), 0);
    });
    $('refresh').addEventListener('click', () => loadUsers());
    $('previous').addEventListener('click', () => changePage(offset - limit));
    $('next').addEventListener('click', () => changePage(offset + limit));

    const createDialog = $('create-dialog');
    const createStatus = $('create-status');
    const createButton = $('submit-create');
    $('open-create').addEventListener('click', () => {
      createStatus.textContent = '';
      createDialog.showModal();
    });
    createDialog.addEventListener('close', () => $('create-user').reset());
    createDialog.addEventListener('cancel', event => {
      if (createButton.disabled) event.preventDefault();
    });
    $('create-user').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      createButton.disabled = true;
      $('close-create').disabled = true;
      createButton.textContent = '正在创建…';
      createStatus.textContent = '';
      createStatus.classList.remove('error', 'success');
      try {
        await api(form.getAttribute('action'), {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(Object.fromEntries(new FormData(form)))
        });
        form.reset();
        createStatus.textContent = '账号已创建。';
        createStatus.classList.add('success');
        await loadUsers();
      } catch (error) {
        createStatus.textContent = error.message;
        createStatus.classList.add('error');
      } finally {
        createButton.disabled = false;
        $('close-create').disabled = false;
        createButton.textContent = '创建账号';
      }
    });

    api('/v1/admin/me').then(admin => {
      $('admin').textContent = admin.email;
      $('logout').hidden = admin.authentication !== 'local';
      $('open-create').hidden = admin.read_only;
      $('query').disabled = false;
      $('search').disabled = false;
      $('refresh').disabled = false;
      return loadUsers();
    }).catch(error => {
      $('admin').textContent = '未登录';
      $('list-status').textContent = error.message;
      $('list-status').classList.add('error');
    });
  </script>
