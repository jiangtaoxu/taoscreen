name: taoscreen-local

x-api: &api
  image: taoscreen-server:local
  build: .
  environment: &environment
    APP_ENV: ${APP_ENV:?请先运行 scripts/setup-local.py}
    HTTP_ADDR: :8080
    DATABASE_URL: postgres://taoscreen:${POSTGRES_PASSWORD:?请先生成本地配置}@postgres:5432/taoscreen?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:?必须明确指定注册策略}
    ALLOW_PASSWORD_LOGIN: ${ALLOW_PASSWORD_LOGIN:-false}
    ALLOW_SOCIAL_SIGNUP: ${ALLOW_SOCIAL_SIGNUP:-false}
    AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-}
    DESKTOP_OAUTH_CALLBACK_SCHEME: ${DESKTOP_OAUTH_CALLBACK_SCHEME:-taoscreen}
    DESKTOP_RELEASE_ORIGIN: ${DESKTOP_RELEASE_ORIGIN:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE:-}
    ADMIN_TOTP_KEY: ${ADMIN_TOTP_KEY:-}
    ADMIN_ACCESS_TEAM_DOMAIN: ${ADMIN_ACCESS_TEAM_DOMAIN:-}
    ADMIN_ACCESS_AUD: ${ADMIN_ACCESS_AUD:-}
    ADMIN_ALLOWED_EMAILS: ${ADMIN_ALLOWED_EMAILS:-}
    DESKTOP_STUN_URLS: ${DESKTOP_STUN_URLS:-}
    DESKTOP_TURN_URLS: ${DESKTOP_TURN_URLS:-}
    DESKTOP_TURN_SECRET: ${DESKTOP_TURN_SECRET:-}
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    CLOUDFLARE_PROXY_CIDRS: ${CLOUDFLARE_PROXY_CIDRS:-}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  auth-tests:
    image: golang:1.26.11-alpine
    profiles: [test]
    working_dir: /src
    volumes:
      - .:/src
      - taoscreen_go_modules:/go/pkg/mod
    environment:
      TAOSCREEN_AUTH_TEST_DATABASE_URL: postgres://taoscreen:${POSTGRES_PASSWORD:?请先生成本地配置}@postgres:5432/taoscreen?sslmode=disable
      TAOSCREEN_AUTH_TEST_REDIS_URL: redis://redis:6379/0
      CGO_ENABLED: "0"
    command: [go, test, ./internal/httpapi, -count=1, -run, "TestSocial|TestAdmin"]
    depends_on:
      api:
        condition: service_healthy
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: taoscreen
      POSTGRES_DB: taoscreen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先生成本地配置}
    volumes:
      - taoscreen_postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U taoscreen -d taoscreen"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *api
    environment:
      <<: *environment
      MIGRATION_DATABASE_URL: postgres://taoscreen:${POSTGRES_PASSWORD:?请先生成本地配置}@postgres:5432/taoscreen?sslmode=disable
    command: [migrate]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *api
    ports: ["127.0.0.1:28080:8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, /server, healthcheck]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  taoscreen_postgres:
  taoscreen_go_modules:
